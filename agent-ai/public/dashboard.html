<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kantor Agent AI</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #0d1117; color: #e6edf3; min-height: 100vh; }
  header { padding: 28px 24px 12px; max-width: 960px; margin: 0 auto; display: flex; align-items: center; gap: 14px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #3fb950; box-shadow: 0 0 10px #3fb950; }
  .dot.off { background: #f85149; box-shadow: 0 0 10px #f85149; }
  h1 { font-size: 22px; }
  .sub { color: #8b949e; font-size: 13px; }
  main { max-width: 960px; margin: 0 auto; padding: 12px 24px 40px; display: grid; gap: 18px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 16px; }
  .card .icon { font-size: 24px; }
  .card h3 { font-size: 15px; margin: 8px 0 4px; }
  .card p { font-size: 12px; color: #8b949e; }
  .card .count { font-size: 26px; font-weight: 700; margin-top: 8px; }
  .feed { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 16px; }
  .feed h2 { font-size: 16px; margin-bottom: 12px; }
  .item { padding: 10px 0; border-top: 1px solid #21262d; font-size: 13px; }
  .item:first-of-type { border-top: none; }
  .kind { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 20px; margin-right: 8px; font-weight: 600; }
  .kind.chat { background: #1f6feb33; color: #79c0ff; }
  .kind.toko { background: #3fb95033; color: #56d364; }
  .kind.security { background: #f8514933; color: #ff7b72; }
  .kind.note { background: #d2992233; color: #e3b341; }
  .time { color: #8b949e; font-size: 11px; margin-left: 8px; }
  .empty { color: #8b949e; font-size: 13px; padding: 12px 0; }
</style>
</head>
<body>
<header>
  <div class="dot" id="statusDot"></div>
  <div>
    <h1>Kantor Agent AI</h1>
    <div class="sub" id="statusText">Menghubungkan…</div>
  </div>
</header>
<main>
  <div class="cards" id="skillCards"></div>
  <div class="feed">
    <h2>Aktivitas Terakhir</h2>
    <div id="feed"><div class="empty">Memuat…</div></div>
  </div>
</main>
<script>
const SKILLS = [
  { kind: 'chat', icon: '💬', name: 'Ngobrol', desc: 'Asisten pribadi + memory' },
  { kind: 'toko', icon: '🏪', name: 'Toko', desc: 'Stok, pesanan, omset' },
  { kind: 'security', icon: '🛡️', name: 'Security Audit', desc: 'Review keamanan kode' },
  { kind: 'note', icon: '📝', name: 'Catatan', desc: 'Ingatan penting (obsidian-mind)' },
];
const feedEl = document.getElementById('feed');
const dotEl = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');

function timeAgo(iso) {
  const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return 'baru saja';
  if (s < 3600) return Math.round(s / 60) + ' mnt lalu';
  if (s < 86400) return Math.round(s / 3600) + ' jam lalu';
  return new Date(iso).toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });
}
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function refresh() {
  try {
    const r = await fetch('/api/activity');
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'gagal');
    dotEl.classList.remove('off');
    statusText.textContent = 'Online — ' + j.activity.length + ' aktivitas terakhir';
    const counts = {};
    for (const a of j.activity) counts[a.kind] = (counts[a.kind] || 0) + 1;
    document.getElementById('skillCards').innerHTML = SKILLS.map(s => `
      <div class="card">
        <div class="icon">${s.icon}</div>
        <h3>${s.name}</h3><p>${s.desc}</p>
        <div class="count">${counts[s.kind] || 0}</div>
      </div>`).join('');
    feedEl.innerHTML = j.activity.length ? j.activity.map(a => `
      <div class="item">
        <span class="kind ${esc(a.kind)}">${esc(a.kind)}</span>
        ${esc(a.summary)}
        <span class="time">${timeAgo(a.created_at)}</span>
      </div>`).join('') : '<div class="empty">Belum ada aktivitas. Chat bot-nya dulu!</div>';
  } catch (e) {
    dotEl.classList.add('off');
    statusText.textContent = 'Tidak terhubung: ' + e.message;
  }
}
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
